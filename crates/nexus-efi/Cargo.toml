[package]
name = "nexus-efi"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nexus-efi"
path = "src/main.rs"
test = false
bench = false

[dependencies]
uefi = { version = "=0.41.0", default-features = false, features = ["panic_handler", "alloc", "global_allocator"] }
ab_glyph = { version = "0.2.32", default-features = false, features = ["libm"] }
sha2 = { version = "0.10.9", default-features = false }
